<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="title description">
  <title id="title">Day 03: causal DAG for backdoor adjustment</title>
  <desc id="description">User experience C causes treatment T, mediator M, and outcome Y. Treatment T causes M and Y, and M causes Y. Adjust for C to block T to C to Y and T to C to M to Y backdoor paths. Preserve T to Y and T to M to Y causal paths to estimate the total effect.</desc>
  <defs>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45309"/>
    </marker>
    <marker id="teal-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="18" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="34" fill="#0f172a" font-size="22" font-weight="700">Adjust for C to estimate the total effect of T</text>
    <g fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#orange-arrow)">
      <path id="C-to-T" d="M 350 136 L 150 264"/>
      <path id="C-to-M" d="M 400 136 L 400 264"/>
      <path id="C-to-Y" d="M 450 136 L 650 264"/>
    </g>
    <g fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#teal-arrow)">
      <path id="T-to-M" d="M 186 302 L 334 302"/>
      <path id="M-to-Y" d="M 466 302 L 614 302"/>
      <path id="T-to-Y" d="M 120 340 C 120 445 680 445 680 340"/>
    </g>
    <g fill="#b45309" font-size="17">
      <text x="205" y="170">logistic assignment</text>
      <text x="425" y="206">0.7</text>
      <text x="567" y="185">1.5</text>
    </g>
    <g fill="#0f766e" font-size="18" font-weight="700">
      <text x="260" y="284">0.8</text>
      <text x="540" y="284">2.0</text>
      <text x="400" y="439">1.0 · direct effect</text>
    </g>
    <g stroke-width="2">
      <rect x="324" y="60" width="152" height="76" rx="14" fill="#fff7ed" stroke="#b45309"/>
      <rect x="54" y="264" width="132" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e"/>
      <rect x="334" y="264" width="132" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e"/>
      <rect x="614" y="264" width="132" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e"/>
    </g>
    <g fill="#0f172a" font-size="26" font-weight="700">
      <text x="400" y="92">C</text>
      <text x="120" y="296">T</text>
      <text x="400" y="296">M</text>
      <text x="680" y="296">Y</text>
    </g>
    <g fill="#334155" font-size="16">
      <text x="400" y="119">User experience</text>
      <text x="120" y="323">Treatment</text>
      <text x="400" y="323">Mediator</text>
      <text x="680" y="323">Outcome</text>
    </g>
    <text x="400" y="367" fill="#0f766e" font-size="16">Mediated effect: 0.8 × 2.0 = 1.6</text>
    <text x="400" y="479" fill="#0f172a" font-size="19" font-weight="700">Total effect: 1.0 + 1.6 = 2.6</text>
  </g>
</svg>

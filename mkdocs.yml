site_name: Causal Inference Study
site_description: Daily causal inference study notes and Python experiments
site_url: https://karim-moon.github.io/Causal/
repo_url: https://github.com/karim-moon/Causal
repo_name: karim-moon/Causal
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Study notes:
      - Day 01 · ATE: day-01/index.md
      - Day 02 · Confounding and Stratification: day-02/index.md
      - Day 03 · DAGs and Backdoor Adjustment: day-03/index.md
  - Writing guide: guide.md

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
